name: Release APK

# 发布走手动触发，日常不需要填任何版本号：
#   CI 从仓库里最高的 vX.Y.Z tag 推 patch+1、从 app/build.gradle.kts 读 versionCode+1，
#   在 runner 内改 build.gradle.kts 后构建；全部成功后才把版本改动提交回 main、
#   打 tag、发 Release。仅当需要跳 minor/major 时才手填 version（如 v0.7.0）。
#   版本提交会顺带重生成 docs/release-pipeline-recipe.md 的事实快照，供 ci.yml 自检。
# 仓库只保留这一条发布流水线，不另起第二条打 tag 的流水线。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '留空自动递增（v0.6.0 → v0.6.1）；想跳 minor/major 时手填，如 v0.7.0'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      changelog_summary: ${{ steps.version.outputs.changelog_summary }}
      sha: ${{ steps.bump.outputs.sha }}
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      LIFETRACK_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      LIFETRACK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      LIFETRACK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 要读到全部历史 tag 才能算出下一个版本号；默认的浅克隆只有当前提交。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 不用 setup-android action：它固定执行 `sdkmanager tools`，2026 年 runner 预装的
      # cmdline-tools 16.0 已移除 tools 包，会以 exit 1 直接失败。改用镜像自带的 sdkmanager。
      - name: Install required SDK packages
        run: |
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_SDK/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # API 37 的平台包名带修订号（platforms;android-37.0），不叫 platforms;android-37。
          # 从可用包列表里取最低的 37.x，与本机 SDK 目录 android-37.0 保持一致。
          AVAILABLE=$("$SDKMANAGER" --list 2>/dev/null)
          PLATFORM=$(printf '%s\n' "$AVAILABLE" | grep -oE 'platforms;android-37\.[0-9]+' | sort -uV | head -1)
          if [ -z "$PLATFORM" ]; then
            echo "::warning::android-37.x missing from sdkmanager --list; falling back to platforms;android-37.0"
            PLATFORM="platforms;android-37.0"
          fi
          echo "Installing $PLATFORM + build-tools;36.0.0"
          if ! "$SDKMANAGER" "$PLATFORM" "build-tools;36.0.0" > /dev/null; then
            echo "::error::SDK package install failed"
            printf '%s\n' "$AVAILABLE" | grep -iE 'android-3[67]|build-tools;36' | head -30
            exit 1
          fi
          PLATFORM_DIR="${PLATFORM#platforms;}"
          test -d "$ANDROID_SDK/platforms/$PLATFORM_DIR" || { echo "::error::$PLATFORM_DIR missing"; exit 1; }
          test -d "$ANDROID_SDK/build-tools/36.0.0" || { echo "::error::build-tools 36.0.0 missing"; exit 1; }
          echo "Android SDK ready at $ANDROID_SDK"

      - name: Prepare release signing config
        run: |
          for name in SIGNING_KEYSTORE_BASE64 LIFETRACK_KEYSTORE_PASSWORD LIFETRACK_KEY_ALIAS LIFETRACK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (see docs/release-guide.md)"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifetrack-release.jks"
          echo "LIFETRACK_KEYSTORE=$RUNNER_TEMP/lifetrack-release.jks" >> "$GITHUB_ENV"

      # 版本号由 CI 决定，源码里只把 versionCode 当作「当前已用最大值」。
      # 这一步只算数、不写文件；版本推算、tag 冲突、更新日志条目任何一项不合规，
      # 都在花几分钟构建之前就失败。
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::发布只能从 main 分支手动触发，当前 ref 是 ${GITHUB_REF}"
            exit 1
          fi

          CURRENT_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$CURRENT_CODE" ]; then
            echo "::error::无法从 app/build.gradle.kts 读取 versionCode"
            exit 1
          fi
          NEXT_CODE=$((CURRENT_CODE + 1))

          # 基线取仓库里最高的 vX.Y.Z tag（fetch-depth: 0 保证 tag 齐全）。
          LATEST_TAG=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -z "$LATEST_TAG" ]; then
            echo "::error::仓库里没有 vX.Y.Z 格式的 tag，无法确定递增基线"
            exit 1
          fi
          BASE=${LATEST_TAG#v}
          IFS=. read -r MAJOR MINOR PATCH <<< "$BASE"
          AUTO_TAG="v${MAJOR}.${MINOR}.$((10#${PATCH} + 1))"

          if [ -n "${REQUESTED:-}" ]; then
            TAG="$REQUESTED"
            if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::手填版本格式应为 v0.7.0，收到: $TAG"
              exit 1
            fi
            HIGHEST=$(printf '%s\n%s\n' "$LATEST_TAG" "$TAG" | sort -V | tail -1)
            if [ "$HIGHEST" != "$TAG" ] || [ "$TAG" = "$LATEST_TAG" ]; then
              echo "::error::手填版本 $TAG 必须高于最新 tag $LATEST_TAG"
              exit 1
            fi
          else
            TAG="$AUTO_TAG"
          fi
          VERSION_NAME=${TAG#v}

          # tag / Release 一律不复用：避免撞车、覆盖旧附件或让 versionCode 倒退。
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "::error::Tag $TAG 已存在，拒绝重复发布"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::远端 Tag $TAG 已存在，拒绝重复发布"
            exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Release $TAG 已存在，拒绝覆盖"
            exit 1
          fi

          # 应用内「更新日志」是编译进 APK 的静态列表，CI 递增版本号不会替它补条目。
          # 首条与本次版本号不一致时，用户装上新包会看到「列表里没有当前版本、也没有
          # 任何一条标『当前』」的静默失效，所以这里必须拦住。
          CHANGELOG_FILE="app/src/main/java/com/example/lifetrack/feature/settings/VersionHistory.kt"
          CHANGELOG_VERSION=$(awk -F'"' '/^[[:space:]]*version = "[0-9]+\.[0-9]+\.[0-9]+",?$/ {print $2; exit}' "$CHANGELOG_FILE")
          CHANGELOG_SUMMARY=$(awk -F'"' '/^[[:space:]]*summary = "/ {print $2; exit}' "$CHANGELOG_FILE")
          if [ -z "${CHANGELOG_VERSION:-}" ] || [ -z "${CHANGELOG_SUMMARY:-}" ]; then
            echo "::error::无法从 $CHANGELOG_FILE 解析首条 version / summary"
            exit 1
          fi
          if [ "$CHANGELOG_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::VersionHistory.kt 首条是 v$CHANGELOG_VERSION，本次要发 v$VERSION_NAME。"
            echo "::error::请先在 $CHANGELOG_FILE 的 versionHistory 最前面补一条 $VERSION_NAME，推到 main 后再重新 Run workflow。"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$NEXT_CODE"
            echo "changelog_summary=$CHANGELOG_SUMMARY"
          } >> "$GITHUB_OUTPUT"
          {
            echo "TAG=$TAG"
            echo "VERSION_NAME=$VERSION_NAME"
            echo "VERSION_CODE=$NEXT_CODE"
            echo "BASE_TAG=$LATEST_TAG"
            echo "BASE_SHA=$GITHUB_SHA"
          } >> "$GITHUB_ENV"
          echo "本次发布: $TAG (versionName=$VERSION_NAME, versionCode=$NEXT_CODE; 基线 $LATEST_TAG)"

      # 先在 runner 的工作副本里改版本号，再用新版本构建，保证 APK 文件名、
      # APK 内 versionCode / versionName、tag 三者一致。此时尚未推送，失败不会留下垃圾提交。
      - name: Bump version in build file
        run: |
          set -euo pipefail
          sed -i -E "s/^([[:space:]]*versionCode = )[0-9]+/\1${VERSION_CODE}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName = )\"[^\"]*\"/\1\"${VERSION_NAME}\"/" app/build.gradle.kts
          GOT_CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          GOT_NAME=$(sed -nE 's/^[[:space:]]*versionName = "([^"]*)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$GOT_CODE" != "$VERSION_CODE" ] || [ "$GOT_NAME" != "$VERSION_NAME" ]; then
            echo "::error::版本写入校验失败: versionCode=$GOT_CODE versionName=$GOT_NAME"
            exit 1
          fi
          git diff -- app/build.gradle.kts

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Verify signature and write checksum
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'LifeTrack-*-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --min-sdk-version 26 "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "Android Debug"; then
            echo "::error::APK is signed with the Android Debug certificate; refusing to publish"
            exit 1
          fi
          APK_NAME=$(basename "$APK")
          (cd "$(dirname "$APK")" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$(dirname "$APK")/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}

      # 开了 R8 之后，线上 release 的崩溃栈是混淆过的，只有 mapping.txt 能还原。
      # 不归档等于放弃线上问题的定位能力；构建失败时也上传，便于排查。
      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      # 放在所有可能失败的构建 / 验签步骤之后：构建没过就不产生版本提交。
      # 用 checkout 注入的 GITHUB_TOKEN 推送，GitHub 不会再因此触发新的 workflow；
      # commit message 里的 [skip ci] 是第二重保险。
      - name: Commit version bump to main
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 版本号变了，配方文档的事实快照要一起更新，否则下次 ci.yml 的 --check 会标红。
          python3 scripts/export_release_pipeline.py --write
          git add app/build.gradle.kts docs/release-pipeline-recipe.md
          git commit -m "chore: release $TAG (versionCode $VERSION_CODE) [skip ci]"

          # 构建期间 main 若被推进，不做 rebase / merge（也不碰任何人的本地仓库），
          # 直接中止让人工确认后重跑，避免把版本提交叠在没测过的代码上。
          REMOTE_SHA=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$REMOTE_SHA" != "$BASE_SHA" ]; then
            echo "::error::main 在发布期间有新提交（$BASE_SHA → $REMOTE_SHA），版本改动未推送；请确认后重新 Run workflow。"
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "::error::版本改动推送失败。若 main 启用了分支保护，需允许 github-actions[bot] 直接推送，或为该规则添加 bypass。"
            exit 1
          fi
          NEW_SHA=$(git rev-parse HEAD)
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          echo "版本改动已推送到 main: $NEW_SHA"

      # 说明正文直接复用 VersionHistory.kt 首条的 summary：与应用内「更新日志」同源，
      # 国内用户在有新版时看到的那行说明也是它。原来 --generate-notes 的 commit 列表
      # 改为末尾的 compare 链接，需要逐条 commit 时点进去看。
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGELOG_SUMMARY: ${{ steps.version.outputs.changelog_summary }}
        run: |
          NOTES=$(printf '%s\n\n**完整变更**：https://github.com/%s/compare/%s...%s' \
            "$CHANGELOG_SUMMARY" "$GITHUB_REPOSITORY" "$BASE_TAG" "$TAG")
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk }}" \
            "${{ steps.apk.outputs.checksum }}" \
            --target "${{ steps.bump.outputs.sha }}" \
            --title "$TAG" \
            --notes "$NOTES"
          echo "Published $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lifetrack-release.jks"

  # Gitee 官方仓库镜像只同步分支/标签/提交，不同步 Release 附件，
  # 因此 APK 必须由本流水线调用 OpenAPI 单独上传。这里复用同一份 release-apk
  # artifact，保证 Gitee 与 GitHub 的签名包字节完全一致。
  mirror-gitee:
    name: Mirror release to Gitee
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION_NAME: ${{ needs.release.outputs.version_name }}
      CHANGELOG_SUMMARY: ${{ needs.release.outputs.changelog_summary }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_OWNER: ${{ vars.GITEE_OWNER || 'saul999' }}
      GITEE_REPO: ${{ vars.GITEE_REPO || 'LifeTrack' }}
      GITEE_BRANCH: ${{ vars.GITEE_BRANCH || 'main' }}
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: dist

      - name: Check Gitee configuration
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Missing repository secret: GITEE_TOKEN (see docs/release-guide.md)"
            exit 1
          fi
          if ! find dist -maxdepth 1 -type f -name 'LifeTrack-*-release.apk' | grep -q .; then
            echo "::error::Release APK missing from artifact"
            exit 1
          fi
          if ! find dist -maxdepth 1 -type f -name '*.apk.sha256' | grep -q .; then
            echo "::error::SHA256 checksum missing from artifact"
            exit 1
          fi

      - name: Create Gitee release and upload attachments
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/releases"

          existing=$(curl -sS "${API}?access_token=${GITEE_TOKEN}&page=1&per_page=100")
          if ! printf '%s' "$existing" | jq -e 'type == "array"' > /dev/null; then
            echo "::error::Cannot list Gitee releases: $existing"
            exit 1
          fi
          if printf '%s' "$existing" | jq -e --arg tag "$TAG" 'any(.[]; .tag_name == $tag)' > /dev/null; then
            echo "::error::Gitee release $TAG already exists; refusing to overwrite"
            exit 1
          fi

          # 应用内更新卡只取 Release body 的第一行非空行当「本版改了什么」，
          # 所以首行必须是 summary，镜像说明退到第二段。
          GITEE_BODY=$(printf '%s\n\n国内分发镜像，权威发布见 https://github.com/%s/releases/tag/%s' \
            "${CHANGELOG_SUMMARY:-本次变更见 GitHub Release}" "$GITHUB_REPOSITORY" "$TAG")

          created=$(curl -sS -X POST "$API" \
            --data-urlencode "access_token=${GITEE_TOKEN}" \
            --data-urlencode "tag_name=${TAG}" \
            --data-urlencode "name=${TAG}" \
            --data-urlencode "body=${GITEE_BODY}" \
            --data-urlencode "target_commitish=${GITEE_BRANCH}" \
            --data-urlencode "prerelease=false")
          release_id=$(printf '%s' "$created" | jq -r '.id // empty')
          if [ -z "$release_id" ]; then
            echo "::error::Gitee release creation failed: $created"
            exit 1
          fi
          echo "Created Gitee release id=$release_id for $TAG"

          for file in dist/*.apk dist/*.apk.sha256; do
            [ -f "$file" ] || continue
            response=$(curl -sS -X POST "${API}/${release_id}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${file}")
            url=$(printf '%s' "$response" | jq -r '.browser_download_url // empty')
            if [ -z "$url" ]; then
              echo "::error::Attachment upload failed for $(basename "$file"): $response"
              exit 1
            fi
            echo "Uploaded $(basename "$file"): $url"
            case "$(basename "$file")" in
              *.apk.sha256) SHA_URL="$url" ;;
              *.apk) APK_URL="$url" ;;
            esac
          done

          if [ -z "${APK_URL:-}" ] || [ -z "${SHA_URL:-}" ]; then
            echo "::error::Missing APK or sha256 URL after upload (apk=${APK_URL:-} sha=${SHA_URL:-})"
            exit 1
          fi

          # 把版本事实 + Gitee 直链写进 latest.json，供客户端绕过被限流的 Gitee REST API。
          # 通过 contents API 创建/更新文件（仓库默认分支须已初始化），认证写不受匿名限流影响。
          MANIFEST=$(jq -n \
            --arg version "$VERSION_NAME" \
            --arg tag "$TAG" \
            --arg notes "${CHANGELOG_SUMMARY:-}" \
            --arg apk "$APK_URL" \
            --arg sha "$SHA_URL" \
            '{version:$version, tag:$tag, notes:$notes, apkUrl:$apk, sha256Url:$sha}')
          echo "Manifest payload: $MANIFEST"
          CONTENT=$(printf '%s' "$MANIFEST" | base64 | tr -d '\n')

          CONTENTS_API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}/contents/latest.json"
          EXISTING_SHA=$(curl -sS "${CONTENTS_API}?access_token=${GITEE_TOKEN}&ref=${GITEE_BRANCH}" \
            | jq -r '.sha // empty')
          if [ -n "$EXISTING_SHA" ]; then
            put_resp=$(curl -sS -X PUT "$CONTENTS_API" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "content=${CONTENT}" \
              --data-urlencode "message=chore: update latest.json for ${TAG}" \
              --data-urlencode "sha=${EXISTING_SHA}" \
              --data-urlencode "branch=${GITEE_BRANCH}")
          else
            put_resp=$(curl -sS -X POST "$CONTENTS_API" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "content=${CONTENT}" \
              --data-urlencode "message=chore: update latest.json for ${TAG}" \
              --data-urlencode "branch=${GITEE_BRANCH}")
          fi
          if ! printf '%s' "$put_resp" | jq -e '.content // .sha // empty' > /dev/null; then
            echo "::error::Failed to write latest.json to Gitee: $put_resp"
            exit 1
          fi
          echo "Wrote latest.json: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/raw/${GITEE_BRANCH}/latest.json"
          echo "Mirror complete: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/${TAG}"
