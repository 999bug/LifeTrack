name: Release APK

# 发布走手动触发：在 Actions 页面填版本号，避免每次 push 都产出 Release。
# 仓库只保留这一条发布流水线，不另起第二条打 tag 的流水线。
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0 (must be v + versionName)'
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.version }}
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      LIFETRACK_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      LIFETRACK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      LIFETRACK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" > /dev/null

      - name: Prepare release signing config
        run: |
          for name in SIGNING_KEYSTORE_BASE64 LIFETRACK_KEYSTORE_PASSWORD LIFETRACK_KEY_ALIAS LIFETRACK_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name (see docs/release-guide.md)"
              exit 1
            fi
          done
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lifetrack-release.jks"
          echo "LIFETRACK_KEYSTORE=$RUNNER_TEMP/lifetrack-release.jks" >> "$GITHUB_ENV"

      - name: Check tag and version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must look like v0.1.0, got: $TAG"
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [ "v$VERSION_NAME" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump versionName/versionCode and use a new tag."
            exit 1
          fi

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify signature and write checksum
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name 'LifeTrack-*-release.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --min-sdk-version 26 "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q "Android Debug"; then
            echo "::error::APK is signed with the Android Debug certificate; refusing to publish"
            exit 1
          fi
          APK_NAME=$(basename "$APK")
          (cd "$(dirname "$APK")" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "checksum=$(dirname "$APK")/$APK_NAME.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            ${{ steps.apk.outputs.apk }}
            ${{ steps.apk.outputs.checksum }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            "${{ steps.apk.outputs.apk }}" \
            "${{ steps.apk.outputs.checksum }}" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
          echo "Published $TAG: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/lifetrack-release.jks"
